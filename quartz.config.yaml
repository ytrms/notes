# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Lorenzo Gravina Notes
  pageTitleSuffix: " | Lorenzo Gravina Notes"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: goatcounter
    websiteId: trms
  locale: en-US
  baseUrl: notes.lorenzogravina.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Inter Tight
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#d8d8d8"
        gray: "#8a8a8a"
        darkgray: "#000000"
        dark: "#000000"
        secondary: "#000000"
        tertiary: "#666666"
        highlight: rgba(0, 0, 0, 0.06)
        textHighlight: "#fff23688"
      darkMode:
        light: "#101010"
        lightgray: "#383838"
        gray: "#8f8f8f"
        darkgray: "#ffffff"
        dark: "#ffffff"
        secondary: "#ffffff"
        tertiary: "#b8b8b8"
        highlight: rgba(255, 255, 255, 0.08)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/unlisted-pages
    enabled: false
    order: 45
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: false
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: false
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/bases-page
    enabled: false
    order: 50
  - source: ./plugins/lore-page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 20
      display: mobile-only
  - source: github:quartz-community/search
    enabled: true
    options:
      enablePreview: true
      fieldPriority:
        - title
        - content
        - tags
    layout:
      position: left
      priority: 30
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 70
  - source: github:quartz-community/reader-mode
    enabled: false
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: false
  - source: github:quartz-community/backlinks
    enabled: false
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    options:
      showReadingTime: false
      showComma: false
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/encrypted-pages
    enabled: false
    order: 900
  - source: github:quartz-community/stacked-pages
    enabled: false
  - source: ./plugins/footer
    enabled: true
layout:
  groups:
    toolbar:
      priority: 30
      direction: row
      gap: 1rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
        afterBody: []
    content:
      exclude:
        - breadcrumbs
        - content-meta
    folder:
      exclude:
        - breadcrumbs
        - tag-list
      positions:
        right: []
    tag:
      exclude:
        - tag-list
      positions:
        right: []
